name: Archlet
description: 'Archlet is an AI-native eSourcing, sourcing-optimization and eAuction platform,
  founded in 2018 in Zurich, Switzerland, that helps procurement teams run RFIs, RFPs, RFQs
  and reverse auctions faster and with more transparency. Its Spark AI engine automates RFx
  setup, auction configuration, scenario generation and bid summarization, while advanced bid
  analytics and scenario optimization unlock savings across strategic, tactical and tail-spend
  sourcing. Archlet exposes open, well-documented APIs for intake, CLM, reporting, supplier
  management and data-lake integrations that sync bi-directionally with ERP and P2P systems such
  as SAP, SAP Ariba, Coupa and Oracle. Trusted by enterprises including PepsiCo, TotalEnergies,
  Bosch, Walmart and FedEx, and backed by HV Capital.'
